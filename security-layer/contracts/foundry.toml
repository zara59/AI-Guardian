[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]
verbosity = 2

[profile.ci]
fuzz = { runs = 256 }
verbosity = 1

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# Deployment + signing secrets are read from the environment ONLY.
# Never commit private keys. `.env` must be git-ignored.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }